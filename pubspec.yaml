name: crm
description: "A new Flutter project."
publish_to: 'none' # Prevents accidental publishing to pub.dev

version: 1.2.5+13

environment:
  sdk: ">=3.6.1 <4.0.0"

dependencies:
  awesome_snackbar_content: ^0.1.5
  bloc: ^9.0.0
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_expandable_fab: ^2.4.1
  flutter_gen: ^5.10.0
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.1.1
  flutter_native_splash: ^2.4.4
  flutter_quill: ^11.2.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^3.0.0
  geocoding: ^3.0.0
  geolocator: ^13.0.3
  hydrated_bloc: ^10.0.0
  intl: any
  intl_utils: any
  latlong2: ^0.9.1
  loading_animation_widget: ^1.3.0
  logger: ^2.5.0
  path_provider: ^2.1.5
  shimmer: ^3.0.0
  syncfusion_flutter_calendar: ^29.1.33
  map_launcher: ^3.5.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^19.0.0
  workmanager: ^0.5.2
  dotted_border: ^2.1.0
  file_picker: ^9.2.1
  flutter_background_service: ^5.1.0
  cron: ^0.6.1
  telephony: ^0.2.0
  wifi_info_flutter: ^2.0.2
  battery: ^2.0.3
  background_location: ^0.13.0
  battery_info: ^1.1.1
  flutter_secure_storage: ^9.2.4
  battery_plus: ^6.2.1
  fl_chart: ^0.70.2
  url_launcher_ios: ^6.3.2

dev_dependencies:
  analyzer: ^7.3.0
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  freezed: ^3.0.4
  json_annotation: ^4.9.0
  json_serializable: ^6.9.4

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  web: false

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/images/errors/
    - assets/images/empty-states/
    - assets/icons/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900

flutter_intl:
  enabled: true
  class_name: S
  arb_dir: lib/l10n
  output_dir: lib/l10n