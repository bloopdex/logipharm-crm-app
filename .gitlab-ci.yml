stages:
  - build
  - deploy

variables:
  ANDROID_FOLDER_ID: "1YAD85zI_JrYqCUzz1yQ10ul6Sz2Nif7Q"
  FIREBASE_TOKEN: "${FIREBASE_TOKEN}"

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .gradle/
    - .pub-cache/

build_android:
  stage: build
  image: ghcr.io/cirruslabs/flutter:3.19.6
  script:
    - flutter pub get
    - flutter build apk --release
  artifacts:
    paths:
      - build/app/outputs/flutter-apk/*.apk
    expire_in: 1 week
  only:
    - branches

deploy_to_firebase:
  stage: deploy
  image: google/cloud-sdk:alpine
  script:
    - apk add --no-cache nodejs npm
    - npm install -g firebase-tools
    - firebase --version
    - firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
      --app 1:880351652544:android:2313a2055c4d7e86cf1b25 \
      --groups a2s-staff \
      --token "$FIREBASE_TOKEN" \
      --release-notes "Automated release from CI"
  dependencies:
    - build_android
  only:
    - branches
